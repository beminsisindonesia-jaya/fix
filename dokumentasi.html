<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Seluruh Dokumentasi – BEM INSIS Indonesia</title>
  <meta name="description" content="Arsip dokumentasi kegiatan BEM INSIS Indonesia Kabinet Inspire.">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@500;600;700&display=swap" rel="stylesheet">

  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
  <link rel="icon" type="image/png" sizes="192x192" href="favicon-192.png">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">

  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="dokumentasi.css">
</head>
<body class="tema-apple">

  <!-- ========== TOP BAR (Kaca Gelap) ========== -->
  <header class="top-bar">
    <div class="top-bar-kiri">
      <a href="index.html" class="brand">
        <img src="Logo-bem.png" alt="Logo">
        <span>BEM INSIS</span>
      </a>
    </div>
    <div class="top-bar-kanan">
      <a href="index.html" class="btn btn-line btn-small">&larr; Kembali</a>
    </div>
  </header>

  <div class="explorer-wrapper">
    <!-- ========== SIDEBAR (Kiri) ========== -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <h2>Dokumentasi</h2>
        <button class="sidebar-tutup" id="sidebarTutup" aria-label="Tutup menu">&times;</button>
      </div>

      <div class="sidebar-search">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
        <input type="text" id="cariJudul" placeholder="Cari kegiatan...">
      </div>

      <div class="sidebar-scroll">
        <h3 class="sidebar-label">Kategori</h3>
        <div class="dok-chips vertikal" id="dokChips" role="group"></div>

        <h3 class="sidebar-label">Divisi</h3>
        <select id="dokDivisi" class="sidebar-select"></select>
      </div>
    </aside>

    <!-- ========== MAIN CONTENT (Kanan) ========== -->
    <main class="main-content">
      <!-- Tombol buka sidebar di HP -->
      <button class="btn-buka-sidebar" id="bukaSidebar">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg>
        Filter & Kategori
      </button>

      <!-- Panel Slider Tanggal (Gaya Kaca Terang) -->
      <section class="panel-atas">
        <div class="panel-atas-info">
          <h1>Arsip Kegiatan</h1>
          <p id="dokRingkas" aria-live="polite">Memuat data...</p>
        </div>

        <div class="dok-waktu" id="dokWaktu">
          <div class="dok-waktu-atas">
            <span class="dok-waktu-judul">Telusuri Tanggal</span>
            <button type="button" class="dok-reset" id="dokReset" hidden>Tampilkan Semua</button>
          </div>
          <div class="dok-slider">
            <output class="dok-bubble" id="dokBubble" for="dokRentang"></output>
            <input type="range" class="dok-rentang" id="dokRentang" min="0" max="0" step="1" value="0">
            <div class="dok-ticks" id="dokTicks" aria-hidden="true"></div>
          </div>
          <div class="dok-waktu-label"><span id="dokAwal"></span><span id="dokAkhir"></span></div>
        </div>
      </section>

      <!-- Galeri Foto -->
      <section class="galeri-area">
        <div id="dokDaftar"></div>
        <div class="dok-lebih">
          <button type="button" class="btn btn-gold dok-lebih-btn" id="dokLebih" hidden>Muat Lebih Banyak</button>
        </div>
      </section>
    </main>
  </div>

  <!-- ========== LIGHTBOX ========== -->
  <div class="lightbox dok-lb" id="dokLb" hidden>
    <div class="lightbox-box" role="dialog" aria-modal="true" aria-labelledby="dokLbJudul">
      <button class="lightbox-close" id="dokLbTutup" aria-label="Tutup">&times;</button>
      <div class="dok-media">
        <div class="dok-kerangka" id="dokKerangka">
          <div class="lightbox-img" id="dokLbFoto"></div>
          <button type="button" class="dok-nav dok-prev" id="dokPrev" aria-label="Sebelumnya">&lsaquo;</button>
          <button type="button" class="dok-nav dok-next" id="dokNext" aria-label="Berikutnya">&rsaquo;</button>
        </div>
      </div>
      <h3 id="dokLbJudul"></h3>
      <p id="dokLbMeta"></p>
      <a class="btn btn-gold lb-album" id="dokLbAlbum" target="_blank" rel="noopener noreferrer" hidden>Lihat album lengkap</a>
      <p class="dok-hitung" id="dokLbHitung"></p>
    </div>
  </div>

  <script src="api.js"></script>
  <script src="dokumentasi.js"></script>
</body>
</html>
