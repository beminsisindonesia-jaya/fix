<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0d0c0a">
  <title>Seluruh Dokumentasi – BEM INSIS Indonesia</title>
  <meta name="description" content="Arsip dokumentasi kegiatan BEM INSIS Indonesia Kabinet Inspire.">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@500;600;700;800&display=swap" rel="stylesheet">

  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
  <link rel="icon" type="image/png" sizes="192x192" href="favicon-192.png">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">

  <!-- Angka ?v= dinaikkan setiap kali berkas diganti, supaya browser tidak memakai salinan lama -->
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="dokumentasi.css?v=20261031">
</head>
<body class="tema-apple">

  <!-- ========== BILAH ATAS ========== -->
  <header class="top-bar">
    <!-- Logo dan judul hanya tampilan (bukan tautan). Jalan kembali ke beranda hanya lewat tombol di kanan. -->
    <div class="brand">
      <img src="Logo-bem.png" alt="">
      <span>Dokumentasi Kegiatan</span>
    </div>
    <!-- #dokumentasi = kembali tepat ke bagian "Dokumentasi kegiatan" di beranda, bukan ke paling atas -->
    <a href="index.html#dokumentasi" class="btn btn-line btn-small">&larr; Kembali</a>
  </header>

  <div class="explorer-wrapper">

    <!-- Lapisan gelap di belakang filter (HP/tablet). Klik di sini = tutup filter -->
    <div class="sidebar-latar" id="sidebarLatar" hidden></div>

    <!-- ========== FILTER (kiri di laptop, laci geser di HP/tablet) ========== -->
    <aside class="sidebar" id="sidebar" aria-label="Filter dokumentasi">
      <div class="sidebar-header">
        <h2>Filter</h2>
        <button type="button" class="sidebar-tutup" id="sidebarTutup" aria-label="Tutup filter">&times;</button>
      </div>

      <div class="sidebar-scroll">
        <h3 class="sidebar-label">Kategori</h3>
        <div class="dok-chips vertikal" id="dokChips" role="group" aria-label="Kategori"></div>

        <label class="sidebar-label" for="dokDivisi">Divisi</label>
        <select id="dokDivisi" class="sidebar-select"></select>

        <label class="sidebar-label" for="dokBulan">Bulan</label>
        <select id="dokBulan" class="sidebar-select"></select>

        <!-- Hanya tampil bila ada filter yang aktif -->
        <button type="button" class="sidebar-reset" id="sidebarReset" hidden>Hapus semua filter</button>
      </div>
    </aside>

    <!-- ========== ISI UTAMA ========== -->
    <main class="main-content">

      <section class="panel-atas">
        <div class="panel-atas-info">
          <p class="eyebrow">BEM INSIS Indonesia &middot; Kabinet Inspire</p>
          <h1>Arsip Kegiatan</h1>
          <p class="ringkas" id="dokRingkas" aria-live="polite">Memuat data...</p>
        </div>

        <div class="dok-waktu" id="dokWaktu" hidden>
          <div class="dok-waktu-atas">
            <span class="dok-waktu-judul">Telusuri tanggal</span>
            <button type="button" class="dok-reset" id="dokReset" hidden>Tampilkan semua tanggal</button>
          </div>
          <div class="dok-slider">
            <output class="dok-bubble" id="dokBubble" for="dokRentang"></output>
            <input type="range" class="dok-rentang" id="dokRentang" min="0" max="0" step="1" value="0" aria-label="Pilih tanggal kegiatan">
            <div class="dok-ticks" id="dokTicks" aria-hidden="true"></div>
          </div>
          <div class="dok-waktu-label"><span id="dokAwal"></span><span id="dokAkhir"></span></div>
        </div>
      </section>

      <!-- Pencarian + tombol filter (tombol hanya tampil di HP/tablet) -->
      <div class="toolbar">
        <div class="cari">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
          <input type="search" id="cariJudul" placeholder="Cari judul kegiatan..." aria-label="Cari judul kegiatan" autocomplete="off">
        </div>
        <button type="button" class="btn-buka-sidebar" id="bukaSidebar" aria-controls="sidebar" aria-expanded="false">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><line x1="4" y1="6" x2="20" y2="6"></line><line x1="7" y1="12" x2="17" y2="12"></line><line x1="10" y1="18" x2="14" y2="18"></line></svg>
          Filter <span class="lencana" id="lencanaFilter" hidden></span>
        </button>
      </div>

      <section class="galeri-area" aria-label="Daftar dokumentasi">
        <div id="dokDaftar"></div>
        <div class="dok-lebih">
          <button type="button" class="btn btn-gold dok-lebih-btn" id="dokLebih" hidden>Muat lebih banyak</button>
        </div>
      </section>
    </main>
  </div>

  <!-- ========== POP-UP FOTO ========== -->
  <div class="lightbox dok-lb" id="dokLb" hidden>
    <div class="lightbox-box" role="dialog" aria-modal="true" aria-labelledby="dokLbJudul">
      <!-- Panggung foto: foto selalu di tengah. Penghitung di kiri atas mengimbangi tombol tutup di kanan atas;
           panah kiri dan kanan sama jaraknya dari tepi. -->
      <div class="dok-kerangka" id="dokKerangka">
        <div class="lightbox-img" id="dokLbFoto"></div>
        <p class="dok-hitung" id="dokLbHitung"></p>
        <button type="button" class="lightbox-close" id="dokLbTutup" aria-label="Tutup foto">&times;</button>
        <button type="button" class="dok-nav dok-prev" id="dokPrev" aria-label="Foto sebelumnya">&lsaquo;</button>
        <button type="button" class="dok-nav dok-next" id="dokNext" aria-label="Foto berikutnya">&rsaquo;</button>
      </div>
      <div class="dok-info">
        <h3 id="dokLbJudul"></h3>
        <div class="dok-pil-baris" id="dokLbMeta"></div>
      </div>
    </div>
  </div>

  <script src="api.js?v=20261031"></script>
  <script src="dokumentasi.js?v=20261031"></script>
</body>
</html>
