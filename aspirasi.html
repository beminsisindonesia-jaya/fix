<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Admin Aspirasi – BEM INSIS Indonesia</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&family=Poppins:wght@500;600;700&display=swap" rel="stylesheet">

  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
  <link rel="icon" type="image/png" sizes="192x192" href="favicon-192.png">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">

  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="admin.css">

  <!-- Penjaga halaman: hanya peran "aspirasi". CATATAN (Hadi): ini hanya pengaman tampilan;
       data aspirasi tetap harus dilindungi di server (Apps Script/API mengecek sandi/peran). -->
  <script src="api.js?v=20261031"></script>
  <script>
    if (!API.sudahMasuk('aspirasi')) {
      document.documentElement.style.display = 'none';
      location.replace('login.html');
    }
  </script>
</head>
<body class="admin">

  <header class="admin-bar">
    <!-- Logo dan judul hanya tampilan (bukan tautan). Jalan keluar hanya lewat tombol di kanan. -->
    <div class="brand"><img src="Logo-bem.png" alt=""><span>Admin Aspirasi</span></div>
    <div class="bar-actions">
      <!-- Keluar = akhiri sesi admin, lalu kembali tepat ke bagian "Aspirasi" di beranda -->
      <a href="index.html#aspirasi" class="btn btn-line btn-small" id="keluarBtn">Keluar</a>
    </div>
  </header>

  <main class="admin-main lebar">

    <section class="panel">
      <h2>Aspirasi masuk <span class="jumlah" id="jumlah"></span></h2>
      <div class="alat">
        <input type="search" id="cari" placeholder="Cari nama atau isi aspirasi..." aria-label="Cari aspirasi">
        <button type="button" class="btn btn-line" id="segarkanBtn">Segarkan</button>
        <button type="button" class="btn btn-gold" id="unduhBtn">Unduh CSV</button>
      </div>
      <p class="error" id="galat" role="alert"></p>

      <div class="tabel-bungkus">
        <table class="tabel">
          <thead><tr><th>No</th><th>Waktu dikirim</th><th>Nama</th><th>Isi aspirasi</th></tr></thead>
          <tbody id="badan"></tbody>
        </table>
      </div>
    </section>
  </main>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script src="aspirasi.js?v=20261031"></script>
  <script>
    if (window.matchMedia('(hover: hover) and (pointer: fine)').matches) {
      document.body.addEventListener('pointermove', e => {
        document.body.style.setProperty('--mx', `${(e.clientX / innerWidth) * 100}%`);
        document.body.style.setProperty('--my', `${(e.clientY / innerHeight) * 100}%`);
      });
    }
  </script>
</body>
</html>
